name: earnings-board
# Keeps the News-tab earnings board (reports.json) up to date without manual work.
#  - 14:00 / 02:00 Israel: Alpha Vantage calendar (dates, timing, EPS estimates, date moves) + reported EPS and
#    revenue estimates for a short priority list. Free personal key in secret ALPHAVANTAGE_KEY (<=25 calls/day, 12 per run).
#  - Every hour on weekdays (outside the 10-minute earnings-live windows; skipped while that loop runs): SEC 8-K Item 2.02 check for rows dated yesterday..tomorrow (release confirmed, time, link),
#    and GAAP revenue actuals from the financials/ shards.
# SEC fair access: UA "SavageTracker Savtra12@gmail.com", 1 req/s here (<=2 req/s overall), official endpoints only, stop on 403/429.
# Shares the sec-edgar-shared concurrency group so it never sends SEC requests alongside the EDGAR report pass or company-profiles, and skips
# the SEC step while the financials / company-profiles / earnings-live jobs run. Never writes notes (הערה / הערה_en); never touches news/calendar.
# Commits only on a real change. push-news queues only rows that can raise a new alert (new results).
on:
  schedule:
    # Alpha Vantage backups for the earnings-live dispatch (14:00 / 02:00 Israel; winter UTC+2, summer UTC+3): a run uses AV
    # only if its due time is 14:00 or 02:00 in Israel that day and it is at most 90 minutes late; one AV run per slot.
    - cron: '0 12 * * *'      # 14:00 Israel (winter)
    - cron: '0 11 * * *'      # 14:00 Israel (summer)
    - cron: '0 0 * * *'       # 02:00 Israel (winter)
    - cron: '0 23 * * *'      # 02:00 Israel (summer)
    - cron: '25 * * * 1-5'    # hourly on US weekdays – SEC detector + shard revenue only
  workflow_dispatch:
    inputs:
      av:
        description: 'Also call Alpha Vantage this run (uses up to 12 of the 25 daily calls)'
        type: boolean
        default: true
permissions:
  contents: write
  actions: write   # bot pushes do not trigger other workflows: dispatch Pages publication and push-news explicitly
concurrency:
  group: sec-edgar-shared
  cancel-in-progress: false
  queue: max
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: restore run state (AV call counter, SEC pause)
        uses: actions/cache/restore@v4
        with:
          path: /tmp/earnings-board/state.json
          key: earnings-board-state-${{ github.run_id }}
          restore-keys: earnings-board-state-
      - name: decide steps
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
          AV_INPUT: ${{ github.event.inputs.av }}
        run: |
          flags="--sec"
          case "$SCHEDULE" in "0 12 * * *"|"0 11 * * *"|"0 0 * * *"|"0 23 * * *") avcron=1 ;; *) avcron= ;; esac
          if [ -n "$avcron" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$AV_INPUT" = "true" ]; }; then flags="--av $flags"; fi
          # A scheduled AV backup runs Alpha Vantage only when its due time is 14:00 or 02:00 Israel time today (the other
          # season's cron is an hour off) and GitHub delivered it at most 90 minutes late (05:00 UTC arrived at 13:34 UTC on
          # 18.11.2026): a late run would spend the calls that belong to the next slot.
          if [ "$EVENT" = "schedule" ] && [ -n "$avcron" ]; then
            if ! reason=$(node scripts/av-slot.cjs "$SCHEDULE"); then echo "::notice::$reason - Alpha Vantage part skipped"; flags="${flags/--av /}"; fi
          fi
          # Keep the combined SEC rate <= 2 req/s: this job uses 1 req/s (financials-fast uses the other 1 req/s);
          # skip SEC requests while the full financials build (2 req/s, outside this group) or company-profiles runs, and while the 10-minute
          # earnings-live loop (1 req/s, same work in the reporting windows) runs. Rechecked inside the script.
          busy=$(gh run list -R "$GITHUB_REPOSITORY" --status in_progress --json workflowName,databaseId --jq ".[] | select(.databaseId != ${GITHUB_RUN_ID}) | .workflowName" | grep -Ei '^(financials|company-profiles)$' || true)
          if node scripts/earnings-live-window.cjs; then busy="${busy} earnings-live window (10:00-02:00 Israel)"; fi
          if [ -n "${busy// /}" ]; then echo "::notice::SEC step skipped this run, busy: $busy"; flags="${flags/--sec/}"; fi
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
      - name: update board
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/earnings-board.cjs ${{ steps.mode.outputs.flags }}
      - name: save run state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/earnings-board/state.json
          key: earnings-board-state-${{ github.run_id }}
      - name: commit, publish, queue alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- reports.json; then echo "nothing to commit"; exit 0; fi
          msg="earnings-board: $(node -e "const s=require('/tmp/earnings-board/summary.json');console.log((s.added||0)+' new, '+(s.changed-(s.added||0))+' updated, '+(s.epsFilled||0)+' EPS, '+(s.revFilled||0)+' revenue, '+(s.secApplied||0)+' SEC confirmations')")"
          git add reports.json && git commit -q -m "$msg"
          pushed=""
          # News bots push often: on a race, re-apply the same fetched data to the newest main (no network), never force.
          for i in 1 2 3 4 5; do
            if git push -q origin HEAD:main; then pushed=1; break; fi
            sleep $((i * 5))
            git fetch -q origin main && git reset -q --hard origin/main
            node scripts/earnings-board.cjs --apply-only
            if git diff --quiet -- reports.json; then echo "already up to date"; exit 0; fi
            git add reports.json && git commit -q -m "$msg"
          done
          if [ -z "$pushed" ]; then echo "::error::push failed after 5 attempts"; exit 1; fi
          after=$(git rev-parse HEAD); before=$(git rev-parse HEAD~1)
          gh workflow run pages-queued.yml --ref main || echo "::warning::could not dispatch Pages publication"
          # Queue alerts only when this commit has alert-worthy rows (new results / row moved onto today-tomorrow).
          n=$(node -e "const {execFileSync}=require('child_process');const s=(c)=>JSON.parse(execFileSync('git',['show',c+':reports.json'],{maxBuffer:1e9}));console.log(require('./scripts/push-news.cjs').alertReports(s('$before'),s('$after')).length)")
          echo "alert-worthy report rows: $n"
          if [ "$n" -gt 0 ]; then gh workflow run push-news.yml --ref main -f before="$before" -f after="$after" || echo "::warning::could not dispatch push-news"; fi
