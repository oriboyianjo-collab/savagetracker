name: push-news
# Queue public data changes durably. Worker sends only after exact public item/version readiness.
# Uses repository secret PUSH_NEWS_KEY, matching the Worker. Missing credentials fail visibly.
# Reads public data only; does not edit the repo. Ingest failure is a visible failed job.
on:
  push:
    branches: [main]
    paths: ['news.json', 'reports.json']
  workflow_dispatch:
    inputs:
      test_title:
        description: 'Optional: send a test alert with this title instead (reaches devices that have "כל חדשה שעולה" on)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}", fetch-depth: 2 }
      - name: tell the Worker
        env:
          PUSH_NEWS_KEY: ${{ secrets.PUSH_NEWS_KEY }}
          BEFORE: ${{ github.event.before }}
          TEST_TITLE: ${{ github.event.inputs.test_title }}
        run: |
          if [ -n "$BEFORE" ] && ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null || true; fi
          if [ -n "$TEST_TITLE" ]; then node scripts/push-news.cjs --test "$TEST_TITLE"; else node scripts/push-news.cjs --before "${BEFORE:-HEAD~1}" --after "$GITHUB_SHA"; fi
