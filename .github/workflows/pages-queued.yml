name: Publish Pages (queued)

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [issuer-holdings, fundamentals]
    types: [completed]
    branches: [main]

# Let the current publication finish. GitHub coalesces waiting runs to the newest.
concurrency:
  group: pages-publication
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  upload:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.package.outputs.name }}
    steps:
      # Read the complete latest snapshot when this queued run starts.
      - name: Checkout latest complete snapshot
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Record published revision
        run: git rev-parse HEAD
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Name this publication package
        id: package
        run: echo "name=github-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Upload unchanged site
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: .
          retention-days: 1

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.upload.outputs.artifact_name }}
