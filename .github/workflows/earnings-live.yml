name: earnings-live
# Earnings board every 10 minutes on every US trading day from 10:00 Israel time until 02:00 Israel time the following
# night (one continuous window, fixed in Israel time; NYSE holidays skipped - scripts/earnings-live-window.cjs).
# Self-chaining: one run is always alive (it waits outside the window) and hands off to a fresh run before the 6-hour job
# limit, so nothing depends on GitHub's schedules (often dropped here); the schedules below only restart a broken chain.
# The chain also dispatches the 07:00 / 19:00 Israel Alpha Vantage earnings-board runs; the daily catch-up of the previous
# days' 8-Ks runs in its first round after 10:00. Form 6-K (foreign issuers) is watched for companies on the board. Each round reads the EDGAR "latest 8-K"
# feed, parses the press release of a new Item 2.02 filing and fills the board row: release confirmed / time / link, EPS
# and revenue (both sanity-checked against the estimate; GAAP figures verified against the prior-year XBRL quarter).
# Outside the window the hourly earnings-board run and the 30-minute financials-fast run cover the same ground.
# SEC fair access: User-Agent "SavageTracker Savtra12@gmail.com", 1 request/second, official sec.gov endpoints only,
# never alongside the financials / financials-fast / earnings-board jobs, HTTP 403/429 stops SEC requests for 24 hours.
# Free (public repo, built-in GITHUB_TOKEN; the Alpha Vantage key is not used here). Commits / Pages / alerts only on a change.
# Never writes notes (הערה / הערה_en), never reads portfolio data, never touches news / calendar.
on:
  schedule:
    - cron: '3,33 * * * *'         # backup only: restarts the chain if it ever stopped (exits at once while it runs)
  workflow_dispatch:
    inputs:
      accession:
        description: 'Optional: filings to (re)process first, CIK:ACCESSION:YYYY-MM-DD separated by commas'
        required: false
        default: ''
      once:
        description: 'Run a single round even outside the window (testing)'
        type: boolean
        default: false
      handoff:
        description: 'Internal: continuation of a run that reached the time limit'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write   # bot pushes trigger nothing: dispatch Pages, push-news and the continuation run explicitly
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: one loop at a time
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF: ${{ github.event.inputs.handoff }}
        run: |
          # A continuation waits for its predecessor to finish; any other run leaves if a loop is already running.
          for i in $(seq 1 12); do
            other=$(gh run list -R "$GITHUB_REPOSITORY" -w earnings-live.yml --status in_progress --json databaseId --jq ".[] | select(.databaseId < ${GITHUB_RUN_ID}) | .databaseId" | head -1)
            [ -z "$other" ] && { echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; }
            [ "$HANDOFF" = "true" ] || break
            sleep 25
          done
          echo "::notice::earnings-live loop already running (run $other) - nothing to do"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == '1'
        with: { ref: main }
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == '1'
        with: { node-version: '22' }
      - if: steps.gate.outputs.go == '1'
        run: pip install --quiet beautifulsoup4==4.12.3 lxml==5.3.0
      - name: restore state (8-K scan, board, SEC hold)
        if: steps.gate.outputs.go == '1'
        uses: actions/cache/restore@v4
        with:
          path: |
            .fast-layer-state.json
            /tmp/earnings-live
          key: earnings-live-state-${{ github.run_id }}
          restore-keys: earnings-live-state-
      - name: rounds every 10 minutes
        id: loop
        if: steps.gate.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SEC_UA: SavageTracker Savtra12@gmail.com
          ACCESSION: ${{ github.event.inputs.accession }}
          FORCE_ONCE: ${{ github.event.inputs.once == 'true' && '1' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/earnings-live.sh
      - name: save state
        if: always() && steps.gate.outputs.go == '1'
        uses: actions/cache/save@v4
        with:
          path: |
            .fast-layer-state.json
            /tmp/earnings-live
          key: earnings-live-state-${{ github.run_id }}
      - name: hand off to a fresh run (6-hour job limit)
        if: steps.loop.outputs.handoff == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run earnings-live.yml --ref main -f handoff=true
